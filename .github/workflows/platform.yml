name: Account platform checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', 'admin/**', '.github/workflows/platform.yml']
  push:
    branches: [feature/premium-upgrade, feature/premium-remittance-full-setup, feature/premium-ui-v1.5]
    paths: ['backend/**', 'admin/**', '.github/workflows/platform.yml']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: global_money_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run typecheck && npm test && npm run test:payment-methods && npm run test:integration
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/global_money_test
      - name: Guarded PostgreSQL 17 migrations and application-role regressions
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/global_money_test
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/global_money_test
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/global_money_test
          TEST_RUNTIME_DATABASE_URL: postgresql://gm_app:test-only-runtime@127.0.0.1:5432/global_money_test
        run: |
          npm run test:migrations
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          npm run migrate
          npm run migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/gm-app-permissions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE gm_app PASSWORD 'test-only-runtime';"
          npm run test:premium15
          npm run test:premium
          npm run test:integrity
      - run: npm ci && npm run build
        working-directory: admin
      - run: python3 android/tools/check_project.py
