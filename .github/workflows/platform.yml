name: Account platform checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', 'admin/**', '.github/workflows/platform.yml']
  push:
    branches: [feature/premium-upgrade]
    paths: ['backend/**', 'admin/**', '.github/workflows/platform.yml']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: global_money_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run typecheck && npm test && npm run test:payment-methods && npm run test:integration
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/global_money_test
      - run: npm ci && npm run build
        working-directory: admin
      - run: python3 android/tools/check_project.py
