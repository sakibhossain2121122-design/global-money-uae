name: Reconstructed 1.5.0 Staging APK
on:
  workflow_dispatch:
  push:
    branches: [feature/premium-ui-v1.5]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Test, lint and build staging only
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PAPI_BASE_URL=https://global-money-uae-staging-api.onrender.com
      - name: Verify and package artifact
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > signing-certificate.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > apk-metadata.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('apk-metadata.txt').read_text()
          assert "name='com.globalmoney.uae.demo'" in text
          assert "versionName='1.5.0'" in text
          assert "versionCode='15'" in text
          PY
          cp "$APK" global-money-uae-1.5.0-premium-staging.apk
          sha256sum global-money-uae-1.5.0-premium-staging.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: global-money-uae-reconstructed-1.5.0-staging
          path: |
            android/global-money-uae-1.5.0-premium-staging.apk
            android/SHA256SUMS
            android/signing-certificate.txt
            android/apk-metadata.txt
            android/app/build/reports/
          retention-days: 14
          if-no-files-found: error
